services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartlink
      POSTGRES_USER: smartlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlink -d smartlink"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL locally}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set an independently generated JWT signing key}
      JWT_ISSUER: ${JWT_ISSUER:-smartlink}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smartlink-api}
      APP_ENV: ${APP_ENV:-development}
      AUTH_RATE_LIMIT_MODE: ${AUTH_RATE_LIMIT_MODE:-local}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-}
      INGRESS_RATE_LIMITS_VERIFIED: ${INGRESS_RATE_LIMITS_VERIFIED:-0}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL locally}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set an independently generated JWT signing key}
      JWT_ISSUER: ${JWT_ISSUER:-smartlink}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smartlink-api}
      APP_ENV: ${APP_ENV:-development}
      AUTH_RATE_LIMIT_MODE: ${AUTH_RATE_LIMIT_MODE:-local}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-}
      INGRESS_RATE_LIMITS_VERIFIED: ${INGRESS_RATE_LIMITS_VERIFIED:-0}
      ALLOW_ANONYMOUS_LINK_CREATION: ${ALLOW_ANONYMOUS_LINK_CREATION:-1}
      ALLOW_ANONYMOUS_ANALYTICS: ${ALLOW_ANONYMOUS_ANALYTICS:-1}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30/minute}
      LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-5/minute}
      REGISTER_IP_LIMIT: ${REGISTER_IP_LIMIT:-10/minute}
      REGISTER_ACCOUNT_LIMIT: ${REGISTER_ACCOUNT_LIMIT:-3/hour}
      ANONYMOUS_CREATE_LIMIT: ${ANONYMOUS_CREATE_LIMIT:-60/minute}
      SECRET_KEY: ${SECRET_KEY:-dev}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "flask --app wsgi:app db-check && exec gunicorn wsgi:app --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
